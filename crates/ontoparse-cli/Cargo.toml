[package]
name = "ontoparse"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/phicks22/ontoparse"

[[bin]]
name = "ontoparse"
path = "src/main.rs"

[dependencies]
ontoparse-core = { path = "../ontoparse-core" }
ontoparse-load = { path = "../ontoparse-load" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
