[package]
name = "ontoparse-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ontoparse"
path = "src/main.rs"

[dependencies]
ontoparse-core = { path = "../ontoparse-core" }
ontoparse-load = { path = "../ontoparse-load" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
