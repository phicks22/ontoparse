[workspace]
members = [
    "crates/ontoparse-core",
    "crates/ontoparse-load",
    "crates/ontoparse-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/phicks22/ontoparse"
version = "0.1.0"
rust-version = "1.98"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
